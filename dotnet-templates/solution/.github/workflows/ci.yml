name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore tools
        run: dotnet tool restore

      # Rung 1 — build and format. Analyzers run in-build; warnings are errors.
      - name: Build
        run: dotnet build --no-incremental
      - name: Format
        run: dotnet format --verify-no-changes

      # Rung 2 — supply chain. Migration safety runs in the delivery cycle,
      # before the branch is pushed.
      - name: Vulnerable packages
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee /tmp/vuln.txt && ! grep -q 'has the following vulnerable' /tmp/vuln.txt

      - name: Secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rung 3 — tests and coverage on changed lines.
      - name: Test
        run: dotnet test --collect:"XPlat Code Coverage" --results-directory artifacts/tests

      - name: Coverage report
        run: dotnet reportgenerator -reports:artifacts/tests/**/coverage.cobertura.xml -targetdir:artifacts/coverage -reporttypes:"TextSummary;Cobertura"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: artifacts/coverage
